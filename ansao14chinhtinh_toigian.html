<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ An 14 Chính Tinh Tử Vi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const BRANCHES = [
            { id: 0, name: "Tý" },
            { id: 1, name: "Sửu" },
            { id: 2, name: "Dần" },
            { id: 3, name: "Mão" },
            { id: 4, name: "Thìn" },
            { id: 5, name: "Tỵ" },
            { id: 6, name: "Ngọ" },
            { id: 7, name: "Mùi" },
            { id: 8, name: "Thân" },
            { id: 9, name: "Dậu" },
            { id: 10, name: "Tuất" },
            { id: 11, name: "Hợi" }
        ];

        const getStarStyle = (starName) => {
            if (starName === "Tử Vi") {
                return "bg-purple-950/80 text-purple-300 border-purple-800/80 font-bold";
            }
            if (starName === "Thiên Phủ") {
                return "bg-amber-950/80 text-amber-300 border-amber-800/80 font-bold";
            }
            // Tử Vi system stars
            const ziweiSystem = ["Thiên Cơ", "Thái Dương", "Vũ Khúc", "Thiên Đồng", "Liêm Trinh"];
            if (ziweiSystem.includes(starName)) {
                return "bg-slate-900/90 text-purple-200 border-purple-950/50";
            }
            // Thiên Phủ system stars
            return "bg-slate-900/90 text-amber-200 border-amber-950/50";
        };

        function App() {
            const [ziweiPos, setZiweiPos] = useState(2); // Default Ziwei at Dần (2)

            const calculatedStars = useMemo(() => {
                const map = Array.from({ length: 12 }, () => []);

                // 1. Purple Star System (Tử Vi Tinh Hệ) - Counter-Clockwise
                const ziwei = ziweiPos;
                const tianji = (ziwei - 1 + 12) % 12;
                const taiduang = (ziwei - 3 + 12) % 12;
                const wuxu = (ziwei - 4 + 12) % 12;
                const tiandong = (ziwei - 5 + 12) % 12;
                const liamtrinh = (ziwei - 8 + 12) % 12;

                map[ziwei].push("Tử Vi");
                map[tianji].push("Thiên Cơ");
                map[taiduang].push("Thái Dương");
                map[wuxu].push("Vũ Khúc");
                map[tiandong].push("Thiên Đồng");
                map[liamtrinh].push("Liêm Trinh");

                // 2. Heavenly Treasury System (Thiên Phủ Tinh Hệ) - Clockwise from axis Dan-Shen
                const tianfu = (4 - ziwei + 12) % 12;
                const taiyin = (tianfu + 1) % 12;
                const tamlang = (tianfu + 2) % 12;
                const cumon = (tianfu + 3) % 12;
                const tiantuang = (tianfu + 4) % 12;
                const tianluong = (tianfu + 5) % 12;
                const thatsat = (tianfu + 6) % 12;
                const phaquan = (tianfu + 10) % 12;

                map[tianfu].push("Thiên Phủ");
                map[taiyin].push("Thái Âm");
                map[tamlang].push("Tham Lang");
                map[cumon].push("Cự Môn");
                map[tiantuang].push("Thiên Tướng");
                map[tianluong].push("Thiên Lương");
                map[thatsat].push("Thất Sát");
                map[phaquan].push("Phá Quân");

                return map;
            }, [ziweiPos]);

            const getGridStyle = (id) => {
                switch(id) {
                    case 5: return { gridRow: 1, gridColumn: 1 }; // Tỵ (Top-Left)
                    case 6: return { gridRow: 1, gridColumn: 2 }; // Ngọ
                    case 7: return { gridRow: 1, gridColumn: 3 }; // Mùi
                    case 8: return { gridRow: 1, gridColumn: 4 }; // Thân (Top-Right)
                    case 9: return { gridRow: 2, gridColumn: 4 }; // Dậu
                    case 10: return { gridRow: 3, gridColumn: 4 }; // Tuất
                    case 11: return { gridRow: 4, gridColumn: 4 }; // Hợi (Bottom-Right)
                    case 0: return { gridRow: 4, gridColumn: 3 }; // Tý
                    case 1: return { gridRow: 4, gridColumn: 2 }; // Sửu
                    case 2: return { gridRow: 4, gridColumn: 1 }; // Dần (Bottom-Left)
                    case 3: return { gridRow: 3, gridColumn: 1 }; // Mão
                    case 4: return { gridRow: 2, gridColumn: 1 }; // Thìn
                    default: return {};
                }
            };

            return (
                <div className="flex flex-col items-center">
                    {}
                    <div className="text-center mb-6">
                        <h1 className="text-2xl md:text-3xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-slate-100 to-purple-300">
                            Bản Đồ An 14 Chính Tinh
                        </h1>
                        <p className="text-xs text-slate-400 mt-1">
                            Nhấp chọn cung địa chi bất kỳ để đặt vị trí sao Tử Vi và tự động an các chính tinh còn lại
                        </p>
                    </div>

                    {}
                    <div className="w-full overflow-x-auto p-2">
                        <div className="min-w-[600px] grid grid-cols-4 grid-rows-4 gap-2 bg-slate-950/80 border border-slate-800 p-3 rounded-xl relative shadow-2xl">
                            
                            {BRANCHES.map((b) => {
                                const starsInPalace = calculatedStars[b.id];
                                const gridStyle = getGridStyle(b.id);
                                const isZiweiHere = ziweiPos === b.id;

                                return (
                                    <div
                                        key={b.id}
                                        style={gridStyle}
                                        onClick={() => setZiweiPos(b.id)}
                                        className={`p-3 min-h-[130px] flex flex-col justify-between rounded-lg border transition-all duration-250 cursor-pointer select-none ${
                                            isZiweiHere 
                                            ? 'border-purple-500 bg-purple-950/10 shadow-[0_0_12px_rgba(168,85,247,0.2)]' 
                                            : 'border-slate-800 bg-slate-900/40 hover:border-slate-700 hover:bg-slate-900/60'
                                        }`}
                                    >
                                        {/* Palace Branch Name */}
                                        <div className="flex justify-between items-center mb-1">
                                            <span className={`text-sm font-extrabold ${isZiweiHere ? 'text-purple-400' : 'text-slate-200'}`}>
                                                Cung {b.name}
                                            </span>
                                            {isZiweiHere && (
                                                <span className="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                                            )}
                                        </div>

                                        {/* Stars Listing inside Palace */}
                                        <div className="flex-grow flex flex-col justify-center gap-1.5 py-1">
                                            {starsInPalace.length === 0 ? (
                                                <div className="text-[10px] text-slate-700 italic text-center">—</div>
                                            ) : (
                                                <div className="flex flex-col gap-1">
                                                    {starsInPalace.map(starName => (
                                                        <div
                                                            key={starName}
                                                            className={`px-1.5 py-0.5 rounded text-[10.5px] text-center border transition-all duration-200 ${getStarStyle(starName)}`}
                                                        >
                                                            {starName}
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}

                            {}
                            <div style={{ gridRow: "2 / span 2", gridColumn: "2 / span 2" }} className="p-4 bg-slate-950 border border-slate-900/60 rounded-xl flex flex-col justify-center items-center text-center shadow-inner">
                                <span className="text-[9px] font-semibold text-amber-400 uppercase tracking-widest border border-amber-900/50 bg-amber-950/30 px-2 py-0.5 rounded mb-2">
                                    Thiên Bàn
                                </span>
                                <div className="text-xs text-slate-400 leading-relaxed space-y-1">
                                    <div>Tử Vi cư tại: <span className="text-purple-300 font-bold">Cung {BRANCHES[ziweiPos].name}</span></div>
                                    <div>Thiên Phủ cư tại: <span className="text-amber-300 font-bold">Cung {BRANCHES[(4 - ziweiPos + 12) % 12].name}</span></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
