            },
            10: {
                title: "Tử Tướng Cư Tuất - Khắc Khổ Trùng Lai",
                description: "Tử Vi Thiên Tướng đồng cung tại Tuất. Đương số có phẩm chất lãnh đạo vững vàng, nghiêm cẩn tự luật. Dù cuộc sống có những giai đoạn rơi vào ngõ cụt gò bó (thế La Võng), nhưng với bản lĩnh trung chính luôn tìm được cách xoay chuyển tình thế ngoạn mục.",
                procon: "Ưu điểm: Trung thành đáng tin cậy, vượt khó kiên cường. Nhược điểm: Đời tư chịu nhiều hy sinh thầm kín."

            11: {
                title: "Tử Sát Cư Hợi - Bôn Ba Chiến Đấu",
                description: "Tử Sát đồng cung tại cung Thủy Hợi lạnh lẽo của phương Bắc. Vua bôn ba ngoài biên ải xa xôi để giữ vững giang sơn. Người có cách cục này mang tinh thần chiến binh quả cảm, thích hành động thực tế hơn lý thuyết suông, cuộc đời giàu biến động ly kỳ thú vị.",
                procon: "Ưu điểm: Không ngại khó khăn hiểm nguy, xông xáo quyết liệt. Nhược điểm: Tâm tính bồn chồn khó yên ổn một chỗ lâu dài."

        function App() {
            const [ziweiPos, setZiweiPos] = useState(2); // Default Tử Vi at Dần (2)
            const [hoveredPalace, setHoveredPalace] = useState(null);
            const [selectedStar, setSelectedStar] = useState(null);
            const [viewMode, setViewMode] = useState("overview"); // overview, elements, relationships
            const [activeTab, setActiveTab] = useState("layout"); // layout, stars, luchai

            // Dynamic calculations of the 14 main stars based on Ziwei's position (0-11)
            const calculatedStars = useMemo(() => {
                const map = Array.from({ length: 12 }, () => []);

                // 1. Purple Star System (Tử Vi tinh hệ) - Go Counter-Clockwise
                const ziwei = ziweiPos;
                const tianji = (ziwei - 1 + 12) % 12;
                const taiduang = (ziwei - 3 + 12) % 12;
                const wuxu = (ziwei - 4 + 12) % 12;
                const tiandong = (ziwei - 5 + 12) % 12;
                const liamtrinh = (ziwei - 8 + 12) % 12;

                map[ziwei].push("Tử Vi");
                map[tianji].push("Thiên Cơ");
                map[taiduang].push("Thái Dương");
                map[wuxu].push("Vũ Khúc");
                map[tiandong].push("Thiên Đồng");
                map[liamtrinh].push("Liêm Trinh");

                // 2. Heavenly Treasury System (Thiên Phủ tinh hệ) - Go Clockwise relative to symmetric axis Dan-Shen
                // Symmetry formula across axis 2 (Dan) and 8 (Shen): f = (4 - v + 12) % 12
                const tianfu = (4 - ziwei + 12) % 12;
                const taiyin = (tianfu + 1) % 12;
                const tamlang = (tianfu + 2) % 12;
                const cumon = (tianfu + 3) % 12;
                const tiantuang = (tianfu + 4) % 12;
                const tianluong = (tianfu + 5) % 12;
                const thatsat = (tianfu + 6) % 12;
                const phaquan = (tianfu + 10) % 12;

                map[tianfu].push("Thiên Phủ");
                map[taiyin].push("Thái Âm");
                map[tamlang].push("Tham Lang");
                map[cumon].push("Cự Môn");
                map[tiantuang].push("Thiên Tướng");
                map[tianluong].push("Thiên Lương");
                map[thatsat].push("Thất Sát");
                map[phaquan].push("Phá Quân");

                return {
                    palaceMap: map,
                    positions: {
                        "Tử Vi": ziwei,
                        "Thiên Cơ": tianji,
                        "Thái Dương": taiduang,
                        "Vũ Khúc": wuxu,
                        "Thiên Đồng": tiandong,
                        "Liêm Trinh": liamtrinh,
                        "Thiên Phủ": tianfu,
                        "Thái Âm": taiyin,
                        "Tham Lang": tamlang,
                        "Cự Môn": cumon,
                        "Thiên Tướng": tiantuang,
                        "Thiên Lương": tianluong,
                        "Thất Sát": thatsat,
                        "Phá Quân": phaquan
                    }
                };
            }, [ziweiPos]);

            // Relationship helper formulas
            const getPalaceRelations = (activeIdx) => {
                if (activeIdx === null) return { tamHop: [], xungChieu: null, nhiHop: null, lucHai: null };
                
                // Tam hợp (Trine): index + 4, index + 8
                const tamHop = [
                    (activeIdx + 4) % 12,
                    (activeIdx + 8) % 12
                ];
                
                // Xung chiếu (Opposition): index + 6
                const xungChieu = (activeIdx + 6) % 12;
                
                // Nhị hợp (Harmony): (13 - index) % 12
                const nhiHop = (13 - activeIdx) % 12;
                
                // Lục hại (Clash): (19 - index) % 12
                const lucHai = (19 - activeIdx) % 12;

                return { tamHop, xungChieu, nhiHop, lucHai };
            };

            const selectedRelations = useMemo(() => {
                return getPalaceRelations(hoveredPalace !== null ? hoveredPalace : ziweiPos);
            }, [hoveredPalace, ziweiPos]);

            const getStarPosition = (starName) => {
                return calculatedStars.positions[starName];
            };

            // Grid mapping to traditional layout coordinates (4x4 layout)
            const getGridStyle = (id) => {
                // Returns custom CSS grid Row & Col based on traditional Earthly Branch index
                switch(id) {
                    case 5: return { gridRow: 1, gridColumn: 1 }; // Tỵ (Top-Left)
                    case 6: return { gridRow: 1, gridColumn: 2 }; // Ngọ
                    case 7: return { gridRow: 1, gridColumn: 3 }; // Mùi
                    case 8: return { gridRow: 1, gridColumn: 4 }; // Thân (Top-Right)
                    case 9: return { gridRow: 2, gridColumn: 4 }; // Dậu
                    case 10: return { gridRow: 3, gridColumn: 4 }; // Tuất
                    case 11: return { gridRow: 4, gridColumn: 4 }; // Hợi (Bottom-Right)
                    case 0: return { gridRow: 4, gridColumn: 3 }; // Tý
                    case 1: return { gridRow: 4, gridColumn: 2 }; // Sửu
                    case 2: return { gridRow: 4, gridColumn: 1 }; // Dần (Bottom-Left)
                    case 3: return { gridRow: 3, gridColumn: 1 }; // Mão
                    case 4: return { gridRow: 2, gridColumn: 1 }; // Thìn
                    default: return {};
                }
            };

            const currentLayoutInfo = LAYOUTS_INFO[ziweiPos] || { title: "Đồ Hình Tử Vi", description: "" };

            // Colors mapping for 5 Elements (Ngũ Hành)
            const getElementBadgeColor = (element) => {
                switch(element) {
                    case "Thủy": return "bg-blue-950/80 text-blue-300 border-blue-800";
                    case "Hỏa": return "bg-red-950/80 text-red-300 border-red-800";
                    case "Thổ": return "bg-amber-950/80 text-amber-300 border-amber-800/80";
                    case "Mộc": return "bg-emerald-950/80 text-emerald-300 border-emerald-800";
                    case "Kim": return "bg-slate-800/80 text-slate-200 border-slate-600";
                    default: return "bg-gray-800 text-gray-200 border-gray-700";
                }
            };

            const getStarColorClasses = (starName) => {
                const meta = STARS_METADATA[starName];
                if (!meta) return "";
                if (viewMode === "elements") {
                    const el = meta.element.includes("Thủy") ? "Thủy" :
                               meta.element.includes("Hỏa") ? "Hỏa" :
                               meta.element.includes("Mộc") ? "Mộc" :
                               meta.element.includes("Kim") ? "Kim" : "Thổ";
                    return getElementBadgeColor(el);
                }
                
                // Default System-based color scheme
                if (starName === "Tử Vi") return "bg-purple-900/40 text-purple-300 border-purple-800 hover:bg-purple-900/60";
                if (starName === "Thiên Phủ") return "bg-amber-900/40 text-amber-300 border-amber-800 hover:bg-amber-900/60";
                
                if (meta.system === "Tử Vi") {
                    return "bg-slate-900 text-purple-200 border-purple-950 hover:bg-purple-950/40";
                } else {
                    return "bg-slate-900 text-amber-200 border-amber-950 hover:bg-amber-950/40";
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-6 md:py-10">
                    {}
                    <header className="text-center mb-8">
                        <div className="inline-flex items-center justify-center space-x-3 mb-2">
                            <span className="p-2 bg-gradient-to-tr from-purple-600 to-amber-500 rounded-lg shadow-lg">
                                <Icon name="compass" className="w-6 h-6 text-white animate-spin-slow" />
                            </span>
                            <h1 className="text-3xl md:text-4xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-white to-purple-300">
                                Bản Đồ Tương Tác An Sao Tử Vi
                            </h1>
                        </div>
                        <p className="text-sm md:text-base text-slate-400 max-w-2xl mx-auto">
                            Hệ thống mô phỏng 12 Đồ hình Bản mệnh. Cho phép di chuyển ngai vị sao <b className="text-purple-300">Tử Vi</b> để xem sự luân chuyển chuẩn xác của 14 Chính tinh của phái Nam Tông và Bắc Tông.
                        </p>
                    </header>

                    {}
                    <div className="mb-6 bg-slate-900/60 border border-slate-800 rounded-xl p-3 flex flex-wrap justify-center items-center gap-2 shadow-inner">
                        <span className="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-2 flex items-center gap-1">
                            <Icon name="map-pin" className="w-3.5 h-3.5 text-purple-400" /> An Tử Vi tại:
                        </span>
                        {BRANCHES.map(b => (
                            <button
                                key={b.id}
                                onClick={() => {
                                    setZiweiPos(b.id);
                                    setSelectedStar("Tử Vi");
                                }}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${
                                    ziweiPos === b.id 
                                    ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md ring-2 ring-purple-400/30 font-bold scale-105' 
                                    : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-slate-700 hover:text-white'
                                }`}
                            >
                                {b.name}
                            </button>
                        ))}
                    </div>

                    {}
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                        <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                            <button 
                                onClick={() => setViewMode("overview")}
                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${viewMode === 'overview' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <Icon name="eye" className="w-3.5 h-3.5" /> Tổng quan hệ thống
                            </button>
                            <button 
                                onClick={() => setViewMode("elements")}
                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${viewMode === 'elements' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <Icon name="palette" className="w-3.5 h-3.5" /> Ngũ hành tinh thể
                            </button>
                            <button 
                                onClick={() => setViewMode("relationships")}
                                className={`px-4 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 ${viewMode === 'relationships' ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                            >
                                <Icon name="git-branch" className="w-3.5 h-3.5" /> Tam hợp & Nhị hợp
                            </button>
                        </div>

                        {/* Current selected pointer */}
                        <div className="text-xs text-slate-400 bg-slate-900/40 px-3 py-1.5 rounded-lg border border-slate-800 flex items-center gap-2">
                            <span className="inline-block w-2.5 h-2.5 rounded-full bg-purple-500 animate-pulse"></span>
                            Tử Vi cư <span className="font-bold text-amber-300">{BRANCHES[ziweiPos].name}</span>, Thiên Phủ đối xứng tại <span className="font-bold text-cyan-300">{BRANCHES[(4 - ziweiPos + 12) % 12].name}</span>
                        </div>
                    </div>

                    {}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        
                        {/* LEFT COLUMN: 12-Palace Chart (Grid 4x4) */}
                        <div className="lg:col-span-8 overflow-x-auto pb-4">
                            <div className="min-w-[650px] tuvi-grid grid grid-cols-4 grid-rows-4 gap-2 bg-slate-950/40 border border-slate-800 p-3 rounded-2xl relative shadow-2xl">
                                
                                {BRANCHES.map((b) => {
                                    const starsInPalace = calculatedStars.palaceMap[b.id];
                                    const gridStyle = getGridStyle(b.id);
                                    
                                    // Relationship statuses
                                    const isSelected = ziweiPos === b.id;
                                    const isHovered = hoveredPalace === b.id;
                                    const isSelectedRef = hoveredPalace !== null ? hoveredPalace : ziweiPos;
                                    
                                    const { tamHop, xungChieu, nhiHop, lucHai } = selectedRelations;
                                    const isTamHop = tamHop.includes(b.id);
                                    const isXungChieu = xungChieu === b.id;
                                    const isNhiHop = nhiHop === b.id;
                                    const isLucHai = lucHai === b.id;

                                    let highlightClass = "border-slate-800 bg-slate-900/60";
                                    let relationLabel = null;

                                    if (viewMode === "relationships") {
                                        if (b.id === isSelectedRef) {
                                            highlightClass = "glow-active border-purple-500 bg-purple-950/10";
                                            relationLabel = "Bản cung";
                                        } else if (isXungChieu) {
                                            highlightClass = "glow-xungchieu border-red-500/80 bg-red-950/5";
                                            relationLabel = "Xung chiếu";
                                        } else if (isTamHop) {
                                            highlightClass = "glow-tamhop border-blue-500/80 bg-blue-950/5";
                                            relationLabel = "Tam hợp";
                                        } else if (isNhiHop) {
                                            highlightClass = "glow-nhihop border-emerald-500/80 bg-emerald-950/5";
                                            relationLabel = "Nhị hợp";
                                        } else if (isLucHai) {
                                            highlightClass = "border-orange-500/60 bg-orange-950/5";
                                            relationLabel = "Lục hại";
                                        }
                                    } else {
                                        // Standard view styling
                                        if (isSelected) {
                                            highlightClass = "glow-active border-purple-500 bg-purple-950/10";
                                        } else if (isHovered) {
                                            highlightClass = "border-slate-600 bg-slate-900";
                                        }
                                    }

                                    return (
                                        <div
                                            key={b.id}
                                            style={gridStyle}
                                            onMouseEnter={() => setHoveredPalace(b.id)}
                                            onMouseLeave={() => setHoveredPalace(null)}
                                            onClick={() => {
                                                setZiweiPos(b.id);
                                                setSelectedStar("Tử Vi");
                                            }}
                                            className={`p-3 min-h-[145px] flex flex-col justify-between rounded-xl border transition-all duration-300 cursor-pointer select-none relative ${highlightClass}`}
                                        >
                                            {/* Palace Header */}
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex flex-col">
                                                    <span className="text-sm font-extrabold text-slate-100 flex items-center gap-1">
                                                        Cung {b.name}
                                                        {isSelected && <span className="text-[9px] bg-purple-600/80 text-white px-1.5 py-0.2 rounded-full font-sans">Vua</span>}
                                                    </span>
                                                    <span className="text-[10px] text-slate-400 font-medium">Hành {b.element} ({b.polarity})</span>
                                                </div>
                                                <span className="text-xs font-serif font-semibold text-slate-600 dark:text-slate-500 bg-slate-950/60 border border-slate-800 px-1.5 py-0.5 rounded">
                                                    {b.id + 1}
                                                </span>
                                            </div>

                                            {/* Stars Listing */}
                                            <div className="flex-grow flex flex-col justify-start gap-1">
                                                {starsInPalace.length === 0 ? (
                                                    <div className="text-[11px] text-slate-600 italic py-2">Vô chính diệu</div>
                                                ) : (
                                                    <div className="flex flex-wrap gap-1">
                                                        {starsInPalace.map(starName => (
                                                            <div
                                                                key={starName}
                                                                onClick={(e) => {
                                                                    e.stopPropagation();
                                                                    setSelectedStar(starName);
                                                                    setActiveTab("stars");
                                                                }}
                                                                className={`px-2 py-1 rounded text-[11px] font-bold border transition-all duration-200 flex items-center gap-1 ${
                                                                    selectedStar === starName 
                                                                    ? 'bg-gradient-to-r from-amber-500/20 to-purple-500/20 text-white border-yellow-400 scale-105 shadow-md shadow-yellow-500/10' 
                                                                    : getStarColorClasses(starName)
                                                                }`}
                                                            >
                                                                {starName === "Tử Vi" && <span className="w-1 h-1 rounded-full bg-purple-400"></span>}
                                                                {starName === "Thiên Phủ" && <span className="w-1 h-1 rounded-full bg-yellow-400"></span>}
                                                                {starName}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Palace Footer Info */}
                                            <div className="mt-2 pt-1 border-t border-slate-800/40 flex justify-between items-center">
                                                <span className="text-[10px] text-slate-500">{b.direction}</span>
                                                {relationLabel && (
                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded font-medium ${
                                                        relationLabel === 'Bản cung' ? 'bg-purple-950 text-purple-400 border border-purple-900/50' :
                                                        relationLabel === 'Xung chiếu' ? 'bg-red-950 text-red-400 border border-red-900/50' :
                                                        relationLabel === 'Tam hợp' ? 'bg-blue-950 text-blue-400 border border-blue-900/50' :
                                                        relationLabel === 'Nhị hợp' ? 'bg-emerald-950 text-emerald-400 border border-emerald-900/50' :
                                                        'bg-orange-950 text-orange-400 border border-orange-900/50'
                                                    }`}>
                                                        {relationLabel}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}

                                {/* CENTER SPACE: 2x2 grid in the middle for Control Center & Dynamic Info */}
                                <div style={{ gridRow: "2 / span 2", gridColumn: "2 / span 2" }} className="p-4 bg-slate-950 border border-slate-800/80 rounded-2xl flex flex-col justify-between shadow-inner celestial-bg">
                                    <div className="text-center">
                                        <span className="text-[9px] font-semibold text-amber-400 uppercase tracking-widest border border-amber-900/80 bg-amber-950/40 px-2 py-0.5 rounded-full inline-block mb-1">
                                            Thiên Bàn Đồ Hình
                                        </span>
                                        <h3 className="text-md font-serif font-bold text-slate-100 line-clamp-1 mb-1">
                                            {currentLayoutInfo.title}
                                        </h3>
                                        <p className="text-[11px] text-slate-400 line-clamp-3 leading-relaxed">
                                            {currentLayoutInfo.description}
                                        </p>
                                    </div>

                                    <div className="border-t border-slate-800/60 pt-3 mt-3 flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                            <span>Thế lục hợp sao Thiên Phủ:</span>
                                            <span className="text-amber-300 font-medium">Nhị Hợp Thái Dương</span>
                                        </div>
                                        <div className="flex justify-between items-center text-[10px] text-slate-400">
                                            <span>Sự phân bổ hệ sao:</span>
                                            <span className="text-purple-300 font-medium">14 Chính Tinh Phân Cực</span>
                                        </div>
                                        <div className="flex justify-between items-center text-[10px]">
                                            <span className="text-slate-500">Mẹo: Click cung ngoài rìa để dời Vua Tử Vi</span>
                                            <span className="text-purple-400 flex items-center gap-0.5 font-bold">
                                                Click <Icon name="mouse-pointer" className="w-3 h-3" />
                                            </span>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {}
                        {/* RIGHT COLUMN: Informational Side Panel */}
                        <div className="lg:col-span-4 flex flex-col gap-6">
                            
                            {/* Navigation Tabs */}
                            <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                                <button
                                    onClick={() => setActiveTab("layout")}
                                    className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${activeTab === 'layout' ? 'bg-gradient-to-tr from-slate-900 to-slate-850 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                                >
                                    Đồ Hình Hiện Tại
                                </button>
                                <button
                                    onClick={() => setActiveTab("stars")}
                                    className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${activeTab === 'stars' ? 'bg-gradient-to-tr from-slate-900 to-slate-850 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                                >
                                    Tính Chất 14 Sao
                                </button>
                                <button
                                    onClick={() => setActiveTab("luchai")}
                                    className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${activeTab === 'luchai' ? 'bg-gradient-to-tr from-slate-900 to-slate-850 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}
                                >
                                    Lục Hại & Nhị Hợp
                                </button>
                            </div>

                            {/* TAB CONTENT: Layout details */}
                            {activeTab === "layout" && (
                                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-5 shadow-xl">
                                    <h4 className="text-lg font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-400 mb-3 flex items-center gap-2">
                                        <Icon name="layout-grid" className="w-5 h-5 text-amber-400" /> Phân Tích Bản Đồ
                                    </h4>
                                    <div className="p-3 bg-slate-950 rounded-xl border border-slate-800/80 mb-4">
                                        <div className="text-xs text-slate-500 mb-1">TÊN GỌI CÁCH CỤC</div>
                                        <div className="text-base font-bold text-white mb-2">{currentLayoutInfo.title}</div>
                                        <p className="text-xs text-slate-300 leading-relaxed mb-1">
                                            {currentLayoutInfo.description}
                                        </p>
                                    </div>

                                    <div className="mb-4">
                                        <div className="text-xs font-semibold text-slate-400 mb-2">Đặc điểm cơ bản:</div>
                                        <div className="text-xs text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 leading-relaxed">
                                            {currentLayoutInfo.procon}
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-800/60 pt-4 mt-4">
                                        <div className="text-xs font-semibold text-slate-400 mb-3 flex items-center gap-1.5">
                                            <Icon name="circle-dot" className="w-3.5 h-3.5 text-purple-400" /> Các trục quan trọng ở đồ hình hiện tại:
                                        </div>
                                        <ul className="space-y-2.5 text-xs text-slate-300">
                                            <li className="flex justify-between">
                                                <span className="text-slate-500">Trục Vua (Tử Vi):</span>
                                                <span className="text-purple-300 font-bold">Cung {BRANCHES[ziweiPos].name}</span>
                                            </li>
                                            <li className="flex justify-between">
                                                <span className="text-slate-500">Trục Kho (Thiên Phủ):</span>
                                                <span className="text-yellow-300 font-bold">Cung {BRANCHES[(4 - ziweiPos + 12) % 12].name}</span>
                                            </li>
                                            <li className="flex justify-between">
                                                <span className="text-slate-500">Mối liên kết Tử - Phủ:</span>
                                                <span className="text-slate-400">
                                                    {ziweiPos % 6 === 2 ? (
                                                        <span className="text-emerald-400 font-semibold flex items-center gap-1"><Icon name="link" className="w-3 h-3" /> Đồng cung tại {BRANCHES[ziweiPos].name}</span>
                                                    ) : (
                                                        <span className="text-amber-400 font-semibold">Đối xứng qua Dần-Thân</span>
                                                    )}
                                                </span>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            )}

                            {/* TAB CONTENT: Stars Info */}
                            {activeTab === "stars" && (
                                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-5 shadow-xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h4 className="text-lg font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-indigo-400 flex items-center gap-2">
                                            <Icon name="sparkles" className="w-5 h-5 text-purple-400" /> Tính Chất Chính Tinh
                                        </h4>
                                        {selectedStar && (
                                            <button 
                                                onClick={() => setSelectedStar(null)}
                                                className="text-[10px] text-slate-400 hover:text-slate-200 border border-slate-800 bg-slate-950 px-2.5 py-1 rounded"
                                            >
                                                Đặt lại
                                            </button>
                                        )}
                                    </div>

                                    {selectedStar ? (
                                        // Selected Star Details
                                        <div>
                                            {(() => {
                                                const starMeta = STARS_METADATA[selectedStar];
                                                const currentPosIdx = getStarPosition(selectedStar);
                                                const branch = BRANCHES[currentPosIdx];
                                                
                                                return (
                                                    <div className="space-y-4">
                                                        <div className="p-3 bg-gradient-to-tr from-slate-950 to-slate-900 rounded-xl border border-slate-800">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <div>
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="text-xl font-bold text-white">{starMeta.name}</span>
                                                                        <span className="text-xs text-slate-500 italic">({starMeta.chinese})</span>
                                                                    </div>
                                                                    <span className="text-[10px] font-semibold text-slate-400 bg-slate-800/60 px-2 py-0.5 rounded mt-1 inline-block">
                                                                        {starMeta.character}
                                                                    </span>
                                                                </div>
                                                                <span className={`px-2 py-0.5 text-xs rounded border ${getElementBadgeColor(starMeta.element)}`}>
                                                                    {starMeta.element}
                                                                </span>
                                                            </div>
                                                            <div className="text-xs text-slate-400 border-t border-slate-800/60 pt-2 mt-2">
                                                                Hệ thống: <span className="text-slate-200 font-semibold">{starMeta.system} Tinh Hệ</span>
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <div className="text-[11px] font-semibold text-slate-400 mb-1">MÔ TẢ CHI TIẾT:</div>
                                                            <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-lg border border-slate-800 leading-relaxed">
                                                                {starMeta.desc}
                                                            </p>
                                                        </div>

                                                        <div>
                                                            <div className="text-[11px] font-semibold text-slate-400 mb-1">TỪ KHÓA TÍNH CHẤT:</div>
                                                            <div className="flex flex-wrap gap-1">
                                                                {starMeta.keywords.split(',').map(kw => (
                                                                    <span key={kw} className="bg-slate-950 text-slate-300 border border-slate-800 text-[10px] px-2 py-1 rounded">
                                                                        {kw.trim()}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        <div className="border-t border-slate-800/60 pt-3 flex justify-between items-center">
                                                            <span className="text-xs text-slate-400">Vị trí hiện tại trên đồ hình:</span>
                                                            <span className="text-xs text-amber-300 bg-slate-950 px-2 py-1 rounded border border-slate-800 font-bold">
                                                                Cung {branch.name} ({branch.direction})
                                                            </span>
                                                        </div>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    ) : (
                                        // Stars List Selection
                                        <div>
                                            <p className="text-xs text-slate-400 mb-4">Click vào một chính tinh dưới đây hoặc trên Bản đồ để xem lý giải chi tiết bản chất của sao:</p>
                                            
                                            <div className="grid grid-cols-2 gap-2">
                                                {Object.keys(STARS_METADATA).map(starName => {
                                                    const meta = STARS_METADATA[starName];
                                                    const pos = getStarPosition(starName);
                                                    return (
                                                        <button
                                                            key={starName}
                                                            onClick={() => setSelectedStar(starName)}
                                                            className="p-2.5 rounded-xl border border-slate-850 bg-slate-950 text-left hover:border-slate-700 hover:bg-slate-900 transition-all flex flex-col justify-between"
                                                        >
                                                            <div className="flex justify-between items-center w-full">
                                                                <span className="text-xs font-bold text-white">{starName}</span>
                                                                <span className="text-[9px] text-slate-500 font-sans">({BRANCHES[pos].name})</span>
                                                            </div>
                                                            <span className="text-[9px] text-slate-400 truncate w-full mt-1">{meta.character}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TAB CONTENT: Lục Hại & Nhị Hợp (Special Deep Dive) */}
                            {activeTab === "luchai" && (
                                <div className="bg-slate-900/40 border border-slate-800 rounded-2xl p-5 shadow-xl">
                                    <h4 className="text-lg font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-cyan-400 mb-3 flex items-center gap-2">
                                        <Icon name="git-merge" className="w-5 h-5 text-emerald-400" /> Lục Hại & Nhị Hợp Học Thuyết
                                    </h4>
                                    
                                    <div className="space-y-4">
                                        <div className="bg-slate-950 p-4 rounded-xl border border-emerald-950 text-xs text-slate-300 space-y-3 leading-relaxed">
                                            <div className="font-bold text-slate-100 flex items-center gap-1">
                                                <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span> 
                                                Bản Chất Thiên Phủ nhị hợp Thái Dương
                                            </div>
                                            <p>
                                                Mặc dù trong giới học thuật thường gọi là "Lục Hại" mang sắc thái mâu thuẫn sâu xa, nhưng về mặt hình học trên tinh bàn Tử Vi, <b>Thiên Phủ luôn luôn đứng ở vị trí Nhị Hợp với Thái Dương</b>.
                                            </p>
                                            <p className="text-[11px] text-slate-400">
                                                Chúng ta có thể kiểm chứng toán học: Nếu Tử Vi ở vị trí <code className="text-purple-300">v</code>, Thiên Phủ sẽ ở <code className="text-amber-300">(4 - v)</code>, còn Thái Dương luôn ở <code className="text-orange-300">(v - 3)</code>. Do tổng chỉ số cung của hai sao luôn luôn là 1 hoặc 13 (đại diện cho trục Nhị Hợp Tý-Sửu, Dần-Hợi...), nên hai ngôi sao này <b>luôn luôn là Nhị Hợp của nhau</b>.
                                            </p>
                                        </div>

                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-3 leading-relaxed">
                                            <div className="font-bold text-slate-100 flex items-center gap-1 text-amber-300">
                                                <Icon name="alert-circle" className="w-4 h-4 text-amber-400" /> Tại sao nhị hợp nhưng lại mang tính "Hại"?
                                            </div>
                                            <p>
                                                Đây gọi là <b>Nhị Hợp sinh khắc / mâu thuẫn nội tại</b>:
                                            </p>
                                            <ul className="list-disc pl-4 space-y-1.5 text-slate-400 text-[11px]">
                                                <li><b>Thiên Phủ (Mậu Thổ - Kho Tàng):</b> Chủ về thu vào, bảo bọc, kín đáo, cần sự ổn định bền vững tối đa.</li>
                                                <li><b>Thái Dương (Bính Hỏa - Mặt Trời):</b> Chủ về phát tán, chiếu sáng rộng khắp, cho đi, đề cao sĩ diện hào sảng.</li>
                                            </ul>
                                            <p>
                                                Sự nhị hợp này mang tính chất "kéo kéo đẩy đẩy" ngầm. Người có Thiên Phủ luôn có một Thái Dương nhị hợp bên cạnh bắt buộc cái kho ấy phải "tiêu pha", phải sĩ diện và gánh vác cho gia đình, xã hội khiến cái kho luôn bị lung lay ngầm.
                                            </p>
                                        </div>

                                        <div className="border-t border-slate-800/60 pt-3">
                                            <div className="text-xs font-semibold text-slate-400 mb-2">Trạng thái Nhị Hợp đồ hình hiện tại:</div>
                                            {(() => {
                                                const tfPos = (4 - ziweiPos + 12) % 12;
                                                const tdPos = (ziweiPos - 3 + 12) % 12;
                                                
                                                return (
                                                    <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-850 text-xs flex justify-between items-center">
                                                        <div>
                                                            <div className="text-slate-400 font-medium">Thiên Phủ tại: <span className="text-yellow-400 font-bold">{BRANCHES[tfPos].name}</span></div>
                                                            <div className="text-slate-400 font-medium">Thái Dương tại: <span className="text-orange-400 font-bold">{BRANCHES[tdPos].name}</span></div>
                                                        </div>
                                                        <div className="text-right text-[11px] text-slate-400">
                                                            Phục vụ cho: <br/>
                                                            <span className="text-purple-300 font-semibold">{BRANCHES[tfPos].element} sinh {BRANCHES[tdPos].element === 'Thủy' ? 'Khắc' : 'Hợp'}</span>
                                                        </div>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>

                    </div>

                    {/* Footer Explanatory Text */}
                    <footer className="mt-12 pt-6 border-t border-slate-900 text-center text-xs text-slate-500">
                        <p>© 2026 Bản Đồ Tương Tác Cổ Học Phương Đông. Thiết kế và phát triển dựa trên nguyên lý Tử Vi Đẩu Số truyền thống.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
